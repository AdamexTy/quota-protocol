name: daily-quota
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      
      - name: Debug secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then echo "TOKEN MANCANTE"; else echo "TOKEN OK esiste"; fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then echo "CHAT_ID MANCANTE"; else echo "CHAT_ID OK esiste"; fi
      
      - name: Test Telegram diretto da Actions
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=[STRIPPED 68 bytes]"

      - name: Run main
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Push changes
        run: |
          echo "__pycache__/" >> .gitignore
          echo "*.pyc" >> .gitignore
          git config user.name "accountant"
          git config user.email "accountant@quota.protocol"
          git add -A
          git diff --staged --quiet || git commit -m "daily cycle"
          git push
